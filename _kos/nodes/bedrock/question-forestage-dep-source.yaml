title: "Migrate forestage dependency from path to git/crates.io"
content: |
  forestage currently depends on tmux-cmc via `path = "../tmux-cmc"`.
  This works for the main checkout and worktrees (clone-for-worktree)
  but creates a hard coupling: you must have both repos cloned at the
  same relative path.

  Three options:
  1. `{ git = "...", tag = "v0.1.0" }` — pinned git tag, no crates.io
     publish required, but cargo.lock must be committed
  2. `{ version = "0.1" }` — crates.io (requires publish)
  3. Keep path for now — acceptable during co-development, switch after
     tmux-cmc stabilises its API

  The worktree clone pattern (`just clone-for-worktree tmux-cmc`) handles
  the path case. This question becomes pressing when forestage wants to
  distribute without requiring tmux-cmc to be cloned alongside it.

  Harvest 2026-11-17 (I-532): the first sentence above is out of date. forestage
  at develop 4716e685 declares `tmux-cmc = { git =
  "https://github.com/ArcavenAE/tmux-cmc", branch = "main" }` (Cargo.toml:32),
  changed from the path dependency in forestage f999be8 (2026-04-03, "switch
  tmux-cmc from path to git dependency"). That is option 1 above with a branch
  in place of a tag. Whether to pin a tag, or to move to crates.io after a
  publish, stays open in the text above. Moved to bedrock 2026-11-18 (I-532
  harvest; operator ruling d1117b-1, option 1, 2026-11-17) as the ruled move for the built state described here.

