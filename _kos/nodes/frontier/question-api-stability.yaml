title: "Is the public API stable enough for external consumers? What would break?"
content: |
  Harvest 2026-11-17 (I-532): this node had no body. finding-002 (blocker B4,
  "Option structs not #[non_exhaustive]") named the instability: ConnectOptions,
  NewSessionOptions, NewWindowOptions and SplitPaneOptions, where "Adding any
  field is a breaking change", with Response also affected. At tmux-cmc e1a7620
  `#[non_exhaustive]` is on the four option structs (`src/command.rs` lines 5,
  31 and 41, and `src/connection.rs:296`), and on the types at `src/error.rs:6`
  and `src/notification.rs:8`. Response (`src/response.rs:3`) carries no
  `#[non_exhaustive]` at that commit. Whether the rest of the public surface is
  stable for external consumers is not assessed here. No confidence change.

