id: question-crates-publish
type: question
confidence: frontier
title: "Publish tmux-cmc to crates.io and set up release CI"
content: |
  The crate is crates.io-ready (no path deps, MIT/Apache-2.0, README)
  but not yet published. The main consumer (forestage) uses a path
  dependency pointing to the adjacent checkout.

  Two gated steps before publish:
  1. `cargo publish --dry-run` passes without warnings
  2. CI release pipeline: tag → cargo publish via token in GitHub
     Actions secret

  After publish: forestage's Cargo.toml should migrate from
  `tmux-cmc = { path = "../tmux-cmc" }` to
  `tmux-cmc = { git = "...", tag = "v0.1.0" }` (or crates.io version).

  Questions:
  - Which org account owns the crates.io publish token?
  - Semver policy: 0.1.x for patch, 0.x.0 for breaking changes until 1.0?
  - Does the async feature flag (question-async-feature) ship before or
    after initial publish? If after, the 0.1.0 API should be considered
    incomplete for async consumers.

  Harvest 2026-11-17 (I-532), at tmux-cmc e1a7620. Findings 001 to 003 are now
  back-referenced: finding-001 (result: confirms, publishable with metadata
  work), finding-002 (the pre-publish review: the title's 4 blockers (its body lists B1 to B6), 11 important,
  8 cosmetic) and finding-003 (no CI is a publish blocker). The built state
  meets part of the two gated steps: Cargo.toml carries the description,
  repository, homepage, documentation, keywords and categories fields and an
  exclude list, and `.github/workflows/ci.yml` runs Rustfmt, Clippy, tests on
  Linux and macOS, and Cargo Deny. No workflow runs `cargo publish` and the
  local clone has no tag, so whether the crate is published is not shown here;
  crates.io was not checked. The statement above that forestage uses a path
  dependency is out of date: see question-forestage-dep-source. No confidence
  change.

